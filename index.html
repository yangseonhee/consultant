<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>식생활교육관 영양상담일지</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/lucide-static@0.321.0/font/lucide.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const [logs, setLogs] = useState([]);
            const [view, setView] = useState('list');
            const [schoolName, setSchoolName] = useState('순천부영초등학교');

            useEffect(() => {
                const saved = localStorage.getItem('nutrition_logs');
                if (saved) setLogs(JSON.parse(saved));
            }, []);

            return (
                <div className="flex min-h-screen">
                    {/* 왼쪽 사이드바 */}
                    <div className="w-64 bg-emerald-800 text-white p-6 flex flex-col shadow-xl">
                        <h1 className="text-xl font-black mb-2">식생활교육관</h1>
                        <p className="text-emerald-200 text-xs mb-8">{schoolName}</p>
                        <nav className="space-y-2">
                            <button onClick={() => setView('list')} className={`w-full text-left p-3 rounded-lg ${view === 'list' ? 'bg-emerald-600' : 'hover:bg-emerald-700'}`}>상담 목록</button>
                            <button onClick={() => setView('add')} className={`w-full text-left p-3 rounded-lg ${view === 'add' ? 'bg-emerald-600' : 'hover:bg-emerald-700'}`}>신규 등록</button>
                        </nav>
                    </div>

                    {/* 메인 콘텐츠 */}
                    <main className="flex-1 p-10">
                        {view === 'list' ? (
                            <div>
                                <h2 className="text-2xl font-bold mb-6">영양상담 기록 목록</h2>
                                <div className="bg-white rounded-xl shadow border overflow-hidden">
                                    <table className="w-full text-left">
                                        <thead className="bg-gray-50 border-b">
                                            <tr>
                                                <th className="p-4">일자</th>
                                                <th className="p-4">대상</th>
                                                <th className="p-4">성명</th>
                                                <th className="p-4">내용</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {logs.length === 0 ? (
                                                <tr><td colSpan="4" className="p-10 text-center text-gray-400">등록된 상담 기록이 없습니다.</td></tr>
                                            ) : (
                                                logs.map(log => (
                                                    <tr key={log.id} className="border-b">
                                                        <td className="p-4">{log.date}</td>
                                                        <td className="p-4 font-bold">{log.gradeClass}</td>
                                                        <td className="p-4 text-emerald-700 font-bold">{log.name}</td>
                                                        <td className="p-4">{log.content}</td>
                                                    </tr>
                                                ))
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        ) : (
                            <div className="max-w-xl">
                                <h2 className="text-2xl font-bold mb-6">신규 기록 등록</h2>
                                <div className="bg-white p-6 rounded-xl shadow border">
                                    <p className="text-gray-500 mb-4">상담 내용을 입력하고 저장해 주세요.</p>
                                    {/* 여기에 입력 폼이 나타납니다 */}
                                    <button onClick={() => setView('list')} className="text-emerald-600 font-bold">목록으로 돌아가기</button>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
