<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>식생활교육관 영양상담일지</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100;400;700;900&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; }
        @media print {
            .no-print { display: none !important; }
            main { padding: 0 !important; margin: 0 !important; width: 100% !important; }
            .print-header { display: block !important; text-align: center; margin-bottom: 20px; }
            table { width: 100% !important; border-collapse: collapse !important; table-layout: fixed; }
            th, td { border: 1px solid #333 !important; padding: 10px !important; word-break: break-all; font-size: 11pt; }
            th { background-color: #f3f4f6 !important; -webkit-print-color-adjust: exact; }
        }
        .print-header { display: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        
        // 아이콘 컴포넌트 (SVG 내장)
        const Icon = ({ name, size = 20, className = "" }) => {
            const icons = {
                printer: <path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6z" />,
                "plus-circle": (
                    <React.Fragment>
                        <circle cx="12" cy="12" r="10" />
                        <line x1="12" y1="8" x2="12" y2="16" />
                        <line x1="8" y1="12" x2="16" y2="12" />
                    </React.Fragment>
                ),
                edit: (
                    <React.Fragment>
                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
                    </React.Fragment>
                ),
                settings: (
                    <React.Fragment>
                        <circle cx="12" cy="12" r="3" />
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
                    </React.Fragment>
                ),
                school: (
                    <React.Fragment>
                        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                        <polyline points="9 22 9 12 15 12 15 22" />
                    </React.Fragment>
                ),
                search: (
                    <React.Fragment>
                        <circle cx="11" cy="11" r="8" />
                        <line x1="21" y1="21" x2="16.65" y2="16.65" />
                    </React.Fragment>
                ),
                "trash-2": (
                    <React.Fragment>
                        <polyline points="3 6 5 6 21 6" />
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                        <line x1="10" y1="11" x2="10" y2="17" />
                        <line x1="14" y1="11" x2="14" y2="17" />
                    </React.Fragment>
                ),
                menu: (
                    <React.Fragment>
                        <line x1="3" y1="12" x2="21" y2="12" />
                        <line x1="3" y1="6" x2="21" y2="6" />
                        <line x1="3" y1="18" x2="21" y2="18" />
                    </React.Fragment>
                ),
                x: (
                    <React.Fragment>
                        <line x1="18" y1="6" x2="6" y2="18" />
                        <line x1="6" y1="6" x2="18" y2="18" />
                    </React.Fragment>
                ),
                "file-down": (
                    <React.Fragment>
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                        <polyline points="7 10 12 15 17 10" />
                        <line x1="12" y1="15" x2="12" y2="3" />
                    </React.Fragment>
                ),
                save: (
                    <React.Fragment>
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" />
                        <polyline points="17 21 17 13 7 13 7 21" />
                        <polyline points="7 3 7 8 15 8" />
                    </React.Fragment>
                )
            };
            return (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name]}
                </svg>
            );
        };

        const App = () => {
            const [logs, setLogs] = useState([]);
            const [view, setView] = useState('list');
            const [schoolName, setSchoolName] = useState('순천부영초등학교');
            const [isSidebarOpen, setIsSidebarOpen] = useState(false);
            const [editingId, setEditingId] = useState(null);
            const [formData, setFormData] = useState({
                date: new Date().toISOString().split('T')[0],
                gradeClass: '',
                name: '',
                content: ''
            });
            const [searchTerm, setSearchTerm] = useState('');

            useEffect(() => {
                const savedLogs = localStorage.getItem('nutrition_logs');
                if (savedLogs) setLogs(JSON.parse(savedLogs));
                const savedSchool = localStorage.getItem('school_name');
                if (savedSchool) setSchoolName(savedSchool);
            }, []);

            const handleInputChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: value }));
            };

            const handleSchoolNameSave = (e) => {
                e.preventDefault();
                localStorage.setItem('school_name', schoolName);
                alert('명칭이 저장되었습니다.');
                setView('list');
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!formData.name || !formData.content) {
                    alert('이름과 상담 내용을 입력해주세요.');
                    return;
                }

                let updatedLogs;
                if (editingId) {
                    updatedLogs = logs.map(log => 
                        log.id === editingId ? { ...formData, id: editingId } : log
                    );
                    alert('상담 내역이 수정되었습니다.');
                } else {
                    const newLog = { ...formData, id: Date.now() };
                    updatedLogs = [newLog, ...logs];
                }

                setLogs(updatedLogs);
                localStorage.setItem('nutrition_logs', JSON.stringify(updatedLogs));
                
                setFormData({ date: new Date().toISOString().split('T')[0], gradeClass: '', name: '', content: '' });
                setEditingId(null);
                setView('list');
                setIsSidebarOpen(false);
            };

            const deleteLog = (id) => {
                if (window.confirm('정말 삭제하시겠습니까?')) {
                    const updatedLogs = logs.filter(log => log.id !== id);
                    setLogs(updatedLogs);
                    localStorage.setItem('nutrition_logs', JSON.stringify(updatedLogs));
                }
            };

            const startEdit = (log) => {
                setFormData({
                    date: log.date,
                    gradeClass: log.gradeClass,
                    name: log.name,
                    content: log.content
                });
                setEditingId(log.id);
                setView('add');
            };

            const handlePrint = () => {
                window.print();
            };

            const exportToCSV = () => {
                if (logs.length === 0) return alert('내보낼 데이터가 없습니다.');
                const headers = ['일자', '학년/반', '이름', '내용'];
                const csvRows = [
                    headers.join(','),
                    ...logs.map(log => `"${log.date}","${log.gradeClass}","${log.name}","${log.content.replace(/"/g, '""')}"`)
                ];
                const blob = new Blob(['\uFEFF' + csvRows.join('\n')], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `${schoolName}_영양상담일지.csv`;
                link.click();
            };

            const filteredLogs = logs.filter(log => 
                log.name.includes(searchTerm) || log.content.includes(searchTerm) || log.gradeClass.includes(searchTerm)
            );

            return (
                <div className="min-h-screen bg-slate-50 flex flex-col md:flex-row text-slate-800">
                    {/* 모바일 헤더 */}
                    <div className="md:hidden flex items-center justify-between p-4 bg-emerald-700 text-white no-print shadow-md">
                        <div className="flex items-center gap-3">
                            <Icon name="school" size={20} />
                            <div className="flex flex-col">
                                <span className="font-black text-sm leading-none">식생활교육관</span>
                                <span className="text-[10px] opacity-80 font-bold tracking-tight">{schoolName}</span>
                            </div>
                        </div>
                        <button onClick={() => setIsSidebarOpen(!isSidebarOpen)}>
                            <Icon name={isSidebarOpen ? "x" : "menu"} size={24} />
                        </button>
                    </div>

                    {/* 사이드바 */}
                    <nav className={`fixed inset-0 z-50 md:relative md:flex w-full md:w-72 bg-emerald-800 text-white p-6 flex-col gap-8 shadow-2xl transition-transform duration-300 no-print ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'}`}>
                        <div className="hidden md:flex flex-col gap-4">
                            <div className="flex items-center gap-3">
                                <div className="bg-white p-2.5 rounded-2xl shadow-inner shrink-0 text-emerald-800">
                                    <Icon name="school" size={28} />
                                </div>
                                <div className="flex flex-col min-w-0">
                                    <h1 className="font-black text-xl leading-none tracking-tighter">식생활교육관</h1>
                                    <p className="text-emerald-200 text-sm font-bold mt-1.5 truncate opacity-90">{schoolName}</p>
                                </div>
                            </div>
                            <div className="h-px bg-emerald-700/50 w-full"></div>
                        </div>

                        <ul className="flex flex-col gap-3 mt-4 md:mt-0">
                            <NavItem active={view === 'list'} onClick={() => {setView('list'); setEditingId(null); setIsSidebarOpen(false);}} icon="printer" label="상담일지 인쇄" />
                            <NavItem active={view === 'add'} onClick={() => {setView('add'); setEditingId(null); setFormData({date: new Date().toISOString().split('T')[0], gradeClass: '', name: '', content: ''}); setIsSidebarOpen(false);}} icon="plus-circle" label="신규 상담 기록" />
                            <NavItem active={view === 'settings'} onClick={() => {setView('settings'); setIsSidebarOpen(false);}} icon="settings" label="명칭 및 환경 설정" />
                        </ul>

                        <div className="mt-auto pt-6 border-t border-emerald-700/50 space-y-4">
                            <button onClick={exportToCSV} className="w-full flex items-center gap-3 px-4 py-3 rounded-xl bg-emerald-900/50 hover:bg-emerald-600 transition-colors text-sm font-medium border border-emerald-600/30 shadow-sm">
                                <Icon name="file-down" size={18} /> CSV 내보내기
                            </button>
                        </div>
                    </nav>

                    <main className="flex-1 p-4 md:p-10 overflow-y-auto w-full">
                        <div className="print-header">
                            <h1 className="text-3xl font-bold mb-1">식생활교육관 영양교육 및 상담일지</h1>
                            <p className="text-lg font-bold text-slate-700 mb-4">{schoolName}</p>
                            <div className="flex justify-between border-b-2 border-slate-900 pb-2 mb-4">
                                <p className="font-bold underline underline-offset-4 tracking-wider">작성자: 영양교사 (인)</p>
                                <p className="text-sm">총 {filteredLogs.length}건 기록 (출력: {new Date().toLocaleDateString()})</p>
                            </div>
                        </div>

                        {view === 'list' && (
                            <div className="max-w-6xl mx-auto space-y-6">
                                <header className="flex flex-col lg:flex-row lg:items-center justify-between gap-4 no-print">
                                    <div>
                                        <h2 className="text-3xl font-black text-slate-800 tracking-tight flex items-center gap-2">상담일지 관리</h2>
                                        <p className="text-slate-500 text-sm mt-1">{schoolName} 식생활교육관 상담 현황</p>
                                    </div>
                                    <div className="flex flex-wrap gap-2">
                                        <div className="relative flex-1 min-w-[200px]">
                                            <Icon name="search" className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400" size={18} />
                                            <input 
                                                type="text" 
                                                placeholder="이름, 학급 검색..." 
                                                value={searchTerm} 
                                                onChange={(e) => setSearchTerm(e.target.value)} 
                                                className="pl-11 pr-4 py-3 border border-slate-200 rounded-2xl w-full focus:ring-4 focus:ring-emerald-500/10 outline-none shadow-sm transition-all" 
                                            />
                                        </div>
                                        <button onClick={handlePrint} className="bg-slate-900 text-white px-6 py-3 rounded-2xl flex items-center gap-2 hover:bg-black font-bold shadow-lg transition-all">
                                            <Icon name="printer" size={18} /> 서류 인쇄하기
                                        </button>
                                    </div>
                                </header>

                                <div className="bg-white rounded-[2rem] shadow-xl border border-slate-100 overflow-hidden">
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left">
                                            <thead className="bg-slate-50 border-b border-slate-100">
                                                <tr>
                                                    <th className="p-5 font-bold text-slate-500 text-xs uppercase w-28 text-center">상담일자</th>
                                                    <th className="p-5 font-bold text-slate-500 text-xs uppercase w-28 text-center">대상학급</th>
                                                    <th className="p-5 font-bold text-slate-500 text-xs uppercase w-28 text-center">성명</th>
                                                    <th className="p-5 font-bold text-slate-500 text-xs uppercase">상담 및 지도 내용</th>
                                                    <th className="p-5 text-center w-28 no-print">관리</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-50">
                                                {filteredLogs.map(log => (
                                                    <tr key={log.id} className="hover:bg-emerald-50/20 transition-colors">
                                                        <td className="p-5 text-sm text-slate-500 align-top text-center whitespace-nowrap">{log.date}</td>
                                                        <td className="p-5 text-sm font-semibold text-slate-700 align-top text-center">{log.gradeClass}</td>
                                                        <td className="p-5 text-sm font-black text-emerald-700 align-top text-center">{log.name}</td>
                                                        <td className="p-5 text-sm text-slate-600 align-top whitespace-pre-wrap leading-relaxed">{log.content}</td>
                                                        <td className="p-5 text-center align-top no-print">
                                                            <div className="flex justify-center gap-2">
                                                                <button onClick={() => startEdit(log)} className="p-2 text-blue-500 hover:text-blue-700 hover:bg-blue-50 rounded-xl bg-blue-50/50" title="수정">
                                                                    <Icon name="edit" size={18} />
                                                                </button>
                                                                <button onClick={() => deleteLog(log.id)} className="p-2 text-red-500 hover:text-red-700 hover:bg-red-50 rounded-xl bg-red-50/50" title="삭제">
                                                                    <Icon name="trash-2" size={18} />
                                                                </button>
                                                            </div>
                                                        </td>
                                                    </tr>
                                                ))}
                                                {filteredLogs.length === 0 && (
                                                    <tr>
                                                        <td colSpan="5" className="p-24 text-center">
                                                            <div className="flex flex-col items-center gap-4 text-slate-300">
                                                                <Icon name="search" size={48} className="opacity-20" />
                                                                <p className="text-lg font-medium italic">등록된 기록이 없습니다.</p>
                                                            </div>
                                                        </td>
                                                    </tr>
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}

                        {view === 'add' && (
                            <div className="max-w-3xl mx-auto no-print">
                                <div className="bg-white p-8 md:p-12 rounded-[2.5rem] shadow-2xl border border-slate-100 relative overflow-hidden">
                                    <div className={`absolute top-0 left-0 w-full h-2 ${editingId ? 'bg-blue-500' : 'bg-emerald-600'}`}></div>
                                    <div className="mb-10 text-center">
                                        <div className={`inline-flex p-4 ${editingId ? 'bg-blue-100 text-blue-700' : 'bg-emerald-100 text-emerald-700'} rounded-2xl mb-4`}>
                                            <Icon name={editingId ? "edit" : "plus-circle"} size={32} />
                                        </div>
                                        <h2 className="text-3xl font-black text-slate-800 tracking-tight">
                                            {editingId ? '상담 기록 수정' : '상담 기록 등록'}
                                        </h2>
                                        <p className="text-slate-500 mt-2 font-medium">{schoolName} 식생활교육관</p>
                                    </div>
                                    <form onSubmit={handleSubmit} className="space-y-6">
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                            <div className="space-y-2">
                                                <label className="text-xs font-black text-slate-400 ml-1">상담 일자</label>
                                                <input type="date" name="date" value={formData.date} onChange={handleInputChange} className="w-full p-4 bg-slate-50 rounded-2xl outline-none font-bold focus:ring-2 focus:ring-emerald-500" />
                                            </div>
                                            <div className="space-y-2">
                                                <label className="text-xs font-black text-slate-400 ml-1">학년 / 반</label>
                                                <input type="text" name="gradeClass" value={formData.gradeClass} onChange={handleInputChange} placeholder="예: 6학년 1반" className="w-full p-4 bg-slate-50 rounded-2xl outline-none font-bold focus:ring-2 focus:ring-emerald-500" />
                                            </div>
                                        </div>
                                        <div className="space-y-2">
                                            <label className="text-xs font-black text-slate-400 ml-1">학생 성명</label>
                                            <input type="text" name="name" value={formData.name} onChange={handleInputChange} placeholder="성명을 입력하세요" className="w-full p-4 bg-slate-50 rounded-2xl outline-none font-bold focus:ring-2 focus:ring-emerald-500" />
                                        </div>
                                        <div className="space-y-2">
                                            <label className="text-xs font-black text-slate-400 ml-1">상담 및 지도 내용</label>
                                            <textarea rows="8" name="content" value={formData.content} onChange={handleInputChange} placeholder="교육 및 상담 내용을 입력하세요..." className="w-full p-5 bg-slate-50 rounded-2xl outline-none resize-none leading-relaxed focus:ring-2 focus:ring-emerald-500"></textarea>
                                        </div>
                                        <div className="flex gap-4 pt-4">
                                            <button 
                                                type="button" 
                                                onClick={() => {setView('list'); setEditingId(null);}} 
                                                className="flex-1 py-5 bg-slate-100 text-slate-600 rounded-2xl font-bold hover:bg-slate-200 transition-all"
                                            >
                                                취소
                                            </button>
                                            <button 
                                                type="submit" 
                                                className={`flex-[2] py-5 ${editingId ? 'bg-blue-600 hover:bg-blue-700' : 'bg-emerald-600 hover:bg-emerald-700'} text-white rounded-2xl font-bold shadow-xl flex items-center justify-center gap-2 transition-all`}
                                            >
                                                <Icon name="save" size={20} /> 
                                                {editingId ? '수정 내용 저장' : '상담 저장하기'}
                                            </button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        )}

                        {view === 'settings' && (
                            <div className="max-w-xl mx-auto no-print">
                                <div className="bg-white p-10 rounded-[2.5rem] shadow-2xl border border-slate-100 relative overflow-hidden">
                                    <div className="absolute top-0 left-0 w-full h-2 bg-slate-800"></div>
                                    <h2 className="text-2xl font-black mb-8 flex items-center gap-3 text-slate-800">
                                        <div className="p-3 bg-slate-100 rounded-2xl"><Icon name="settings" size={24} /></div>
                                        앱 환경 설정
                                    </h2>
                                    <form onSubmit={handleSchoolNameSave} className="space-y-8">
                                        <div className="space-y-3">
                                            <label className="text-xs font-black text-slate-400 ml-1 uppercase tracking-widest">학교 공식 명칭</label>
                                            <input 
                                                type="text" 
                                                value={schoolName} 
                                                onChange={(e) => setSchoolName(e.target.value)} 
                                                className="w-full p-5 bg-slate-50 border-2 border-slate-100 rounded-2xl outline-none font-black text-xl text-emerald-900 focus:ring-2 focus:ring-emerald-500" 
                                                placeholder="예: 순천부영초등학교" 
                                            />
                                            <p className="text-xs text-slate-400 leading-relaxed font-medium">* 입력하신 학교 이름은 사이드바와 인쇄물 상단 등에 표시됩니다.</p>
                                        </div>
                                        <button type="submit" className="w-full py-5 bg-slate-900 text-white rounded-2xl font-bold shadow-xl transition-all hover:bg-black flex items-center justify-center gap-2">
                                            <Icon name="save" size={20} /> 설정 저장하기
                                        </button>
                                    </form>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const NavItem = ({ active, onClick, icon, label }) => (
            <li>
                <button onClick={onClick} className={`w-full flex items-center gap-4 px-5 py-4 rounded-2xl transition-all ${active ? 'bg-white text-emerald-900 font-black shadow-lg scale-[1.02]' : 'text-emerald-100 hover:bg-white/10 hover:text-white font-medium'}`}>
                    <Icon name={icon} size={22} />
                    <span className="text-[16px]">{label}</span>
                    {active && <div className="ml-auto w-1.5 h-1.5 bg-emerald-600 rounded-full animate-pulse"></div>}
                </button>
            </li>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
