<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>식생활교육관 영양상담일지</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/lucide-static@0.321.0/font/lucide.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100;400;700;900&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; }
        @media print {
            .no-print { display: none !important; }
            main { padding: 0 !important; margin: 0 !important; width: 100% !important; }
            .print-header { display: block !important; text-align: center; margin-bottom: 20px; }
            table { width: 100% !important; border-collapse: collapse !important; table-layout: fixed; }
            th, td { border: 1px solid #333 !important; padding: 10px !important; word-break: break-all; font-size: 11pt; }
            th { background-color: #f3f4f6 !important; -webkit-print-color-adjust: exact; }
        }
        .print-header { display: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        
        const Icon = ({ name, size = 20, className = "" }) => (
            <i className={`lucide-${name} ${className}`} style={{ fontSize: size, fontStyle: 'normal', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', width: size, height: size }}></i>
        );

        const NavItem = ({ active, onClick, icon, label }) => (
            <li onClick={onClick} className={`flex items-center gap-3 px-4 py-3 rounded-xl cursor-pointer transition-all ${active ? 'bg-emerald-600 text-white shadow-lg' : 'text-emerald-100 hover:bg-emerald-700/50'}`}>
                <Icon name={icon} size={18} />
                <span className="font-medium">{label}</span>
            </li>
        );

        const App = () => {
            const [logs, setLogs] = useState([]);
            const [view, setView] = useState('list');
            const [schoolName, setSchoolName] = useState('순천부영초등학교');
            const [isSidebarOpen, setIsSidebarOpen] = useState(false);
            const [formData, setFormData] = useState({
                date: new Date().toISOString().split('T')[0],
                gradeClass: '',
                name: '',
                content: ''
            });
            const [searchTerm, setSearchTerm] = useState('');

            useEffect(() => {
                const savedLogs = localStorage.getItem('nutrition_logs');
                if (savedLogs) setLogs(JSON.parse(savedLogs));
                const savedSchool = localStorage.getItem('school_name');
                if (savedSchool) setSchoolName(savedSchool);
            }, []);

            const handleInputChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: value }));
            };

            const handleSchoolNameSave = (e) => {
                e.preventDefault();
                localStorage.setItem('school_name', schoolName);
                alert('학교 이름이 저장되었습니다.');
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!formData.name || !formData.content) {
                    alert('이름과 상담 내용을 입력해주세요.');
                    return;
                }
                const newLog = { ...formData, id: Date.now() };
                const updatedLogs = [newLog, ...logs];
                setLogs(updatedLogs);
                localStorage.setItem('nutrition_logs', JSON.stringify(updatedLogs));
                setFormData({ date: new Date().toISOString().split('T')[0], gradeClass: '', name: '', content: '' });
                setView('list');
                setIsSidebarOpen(false);
            };

            const deleteLog = (id) => {
                if (window.confirm('정말 삭제하시겠습니까?')) {
                    const updatedLogs = logs.filter(log => log.id !== id);
                    setLogs(updatedLogs);
                    localStorage.setItem('nutrition_logs', JSON.stringify(updatedLogs));
                }
            };

            const exportToCSV = () => {
                if (logs.length === 0) return alert('내보낼 데이터가 없습니다.');
                const headers = ['일자', '학년/반', '이름', '내용'];
                const csvRows = [
                    headers.join(','),
                    ...logs.map(log => `"${log.date}","${log.gradeClass}","${log.name}","${log.content.replace(/"/g, '""')}"`)
                ];
                const blob = new Blob(['\uFEFF' + csvRows.join('\n')], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `${schoolName}_영양상담일지.csv`;
                link.click();
            };

            const filteredLogs = logs.filter(log => 
                log.name.includes(searchTerm) || log.content.includes(searchTerm) || log.gradeClass.includes(searchTerm)
            );

            return (
                <div className="min-h-screen bg-slate-50 flex flex-col md:flex-row text-slate-800">
                    {/* 사이드바 및 레이아웃 생략 방지를 위한 전체 구조 유지 */}
                    <nav className={`fixed inset-0 z-50 md:relative md:flex w-full md:w-72 bg-emerald-800 text-white p-6 flex-col gap-8 no-print ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'} transition-transform`}>
                        <div className="flex items-center gap-3">
                            <Icon name="school" size={28} />
                            <div>
                                <h1 className="font-black text-xl leading-none">식생활교육관</h1>
                                <p className="text-emerald-200 text-sm mt-1">{schoolName}</p>
                            </div>
                        </div>
                        <ul className="flex flex-col gap-3 mt-4">
                            <NavItem active={view === 'list'} onClick={() => setView('list')} icon="printer" label="상담일지 목록" />
                            <NavItem active={view === 'add'} onClick={() => setView('add')} icon="plus-circle" label="신규 상담 기록" />
                            <NavItem active={view === 'settings'} onClick={() => setView('settings')} icon="settings" label="환경 설정" />
                        </ul>
                        <button onClick={exportToCSV} className="mt-auto flex items-center gap-3 px-4 py-3 rounded-xl bg-emerald-900/50 hover:bg-emerald-600 transition-colors">
                            <Icon name="file-down" size={18} /> CSV 내보내기
                        </button>
                    </nav>

                    <main className="flex-1 p-4 md:p-10 overflow-y-auto">
                        {view === 'list' && (
                            <div className="max-w-6xl mx-auto">
                                <header className="flex justify-between items-center mb-6 no-print">
                                    <h2 className="text-3xl font-black">상담일지 목록</h2>
                                    <button onClick={() => window.print()} className="bg-slate-900 text-white px-6 py-3 rounded-2xl flex items-center gap-2 hover:bg-black font-bold">
                                        <Icon name="printer" size={18} /> 인쇄
                                    </button>
                                </header>
                                <div className="bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-100">
                                    <table className="w-full text-left">
                                        <thead className="bg-slate-50 border-b">
                                            <tr>
                                                <th className="p-5 w-32">일자</th>
                                                <th className="p-5 w-32">대상</th>
                                                <th className="p-5 w-32">성명</th>
                                                <th className="p-5">내용</th>
                                                <th className="p-5 w-16 no-print"></th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y">
                                            {filteredLogs.map(log => (
                                                <tr key={log.id} className="hover:bg-slate-50 group">
                                                    <td className="p-5 text-sm">{log.date}</td>
                                                    <td className="p-5 text-sm font-bold">{log.gradeClass}</td>
                                                    <td className="p-5 text-sm font-black text-emerald-700">{log.name}</td>
                                                    <td className="p-5 text-sm leading-relaxed">{log.content}</td>
                                                    <td className="p-5 no-print">
                                                        <button onClick={() => deleteLog(log.id)} className="text-slate-300 hover:text-red-500">
                                                            <Icon name="trash-2" size={18} />
                                                        </button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {view === 'add' && (
                            <div className="max-w-2xl mx-auto">
                                <h2 className="text-3xl font-black mb-8">신규 상담 기록</h2>
                                <form onSubmit={handleSubmit} className="space-y-6 bg-white p-8 rounded-3xl shadow-xl border border-slate-100">
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-sm font-bold mb-2">상담일자</label>
                                            <input type="date" name="date" value={formData.date} onChange={handleInputChange} className="w-full p-4 border rounded-2xl outline-none focus:ring-4 focus:ring-emerald-500/10" />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-bold mb-2">대상 학급</label>
                                            <input type="text" name="gradeClass" value={formData.gradeClass} onChange={handleInputChange} placeholder="예: 2-1" className="w-full p-4 border rounded-2xl outline-none focus:ring-4 focus:ring-emerald-500/10" />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold mb-2">학생 성명</label>
                                        <input type="text" name="name" value={formData.name} onChange={handleInputChange} className="w-full p-4 border rounded-2xl outline-none focus:ring-4 focus:ring-emerald-500/10" />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold mb-2">상담 내용</label>
                                        <textarea name="content" value={formData.content} onChange={handleInputChange} rows="5" className="
